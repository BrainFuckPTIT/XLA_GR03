project:
  name: XLA_GR03
  seed: 42

data:
  raw_dir: data/raw
  ground_truth_dir: data/ground_truth
  processed_dir: data/processed
  foreground: bright

preprocessing:
  percentile_min: 1.0
  percentile_max: 99.8
  gaussian_sigma: 1.0

stardist:
  model: 2D_versatile_fluo
  probability_threshold: null
  nms_threshold: null
  n_tiles: null

otsu:
  min_size: 20
  closing_radius: 1

watershed:
  min_size: 20
  closing_radius: 1
  min_distance: 5
  watershed_line: false

evaluation:
  iou_thresholds: [0.50, 0.55, 0.60, 0.65, 0.70, 0.75, 0.80, 0.85, 0.90]
  metrics:
    - accuracy
    - precision
    - recall
    - f1
    - panoptic_quality
    - foreground_dice
    - foreground_iou
    - count_absolute_error

output:
  directory: results
  save_labels: true
  save_json: true
